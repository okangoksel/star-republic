<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Star Republic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-shell">
  <canvas id="game" aria-label="Star Republic oyun alanı"></canvas>
  <div id="hud">
    <div class="panel stats">
      <div class="title">STAR REPUBLIC</div>
      <div>❤️ <span id="hp">100/100</span></div>
      <div>⚡ <span id="energy">100/100</span></div>
      <div>⭐ Lv.<span id="level">1</span> · <span id="xp">0/100</span> XP</div>
    </div>
    <div class="panel world-info">
      <div>📅 Gün <span id="day">1</span></div>
      <div>🕒 <span id="time">06:00</span></div>
      <div>💰 <span id="gold">50</span></div>
    </div>
    <div id="toast"></div>
    <div id="debug" class="panel debug hidden"></div>
  </div>
  <div id="hotbar"></div>
  <div id="help">WASD hareket · Sol tık saldır · E etkileşim · I envanter · F3 debug · 1-9 hotbar · ESC menü</div>
  <div id="inventory" class="modal hidden"></div>
  <div id="menu" class="modal hidden">
    <div class="modal-card">
      <h1>STAR REPUBLIC</h1>
      <p>Keşfet · Üret · Savaş · Güçlen</p>
      <button id="resume">Devam Et</button>
      <button id="save">Kaydet</button>
      <button id="reset">Yeni Oyun</button>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
