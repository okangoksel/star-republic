<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Star Republic</title><link rel="stylesheet" href="style.css"></head>
<body><div id="game-shell"><canvas id="game" aria-label="Star Republic oyun alanı"></canvas><div id="hud">
<div class="panel stats"><div class="title">STAR REPUBLIC</div><div>❤️ <span id="hp">100/100</span></div><div>⚡ <span id="energy">100/100</span></div><div>⭐ Lv.<span id="level">1</span> · <span id="xp">0/100</span> XP</div></div>

<div id="inventory" class="modal hidden"></div><div id="menu" class="modal hidden"><div class="modal-card"><h1>STAR REPUBLIC</h1><p>Hiçbir şeyin yok. Dünyayı okuyup kendi yolunu kur.</p><button id="resume">Devam Et</button><button id="save">Kaydet</button><button id="reset">Yeni Oyun</button></div></div>
</div><script type="module" src="./src/main.js"></script></body></html>
